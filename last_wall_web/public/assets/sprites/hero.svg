  <rect x="24" y="40" width="6" height="14" rx="2" fill="#4a3426"/>
  <rect x="13" y="50" width="8" height="6" rx="2" fill="#2b1d14"/>
  <rect x="23" y="50" width="8" height="6" rx="2" fill="#2b1d14"/>
  <!-- raised arms -->
  <rect x="5" y="6" width="6" height="24" rx="3" fill="#8a1f1f" transform="rotate(-8 8 18)"/>
  <rect x="33" y="6" width="6" height="24" rx="3" fill="#8a1f1f" transform="rotate(8 36 18)"/>
